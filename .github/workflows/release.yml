name: Unzip, Build & Release
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          mkdir project
          unzip -q "$ZIP" -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Rename APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk GameBoost.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Game Boost v${{ github.run_number }}
          files: GameBoost.apk
